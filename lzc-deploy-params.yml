      name: TickFlow API Key
      description: 可选。留空使用免费模式（历史日K可用）；填写后解锁全市场实时行情与更多历史数据。可在 tickflow.org 注册获取。
    ai_api_key:
      name: AI 接口密钥
      description: 可选。任意 OpenAI 兼容接口（DeepSeek / 通义千问 / Ollama 等）。留空则关闭 AI 功能，不影响策略、回测、监控等核心能力。
    ai_base_url:
      name: AI 接口地址
      description: 可选。OpenAI 兼容接口的 Base URL，例如 https://api.deepseek.com/v1。留空使用默认。
  en-US:
    tickflow_api_key:
      name: TickFlow API Key
      description: Optional. Leave empty for the free mode (historical daily K-line). Add a key to unlock full-market real-time quotes and more history. Register at tickflow.org.
    ai_api_key:
      name: AI API Key
      description: Optional. Any OpenAI-compatible endpoint (DeepSeek / Qwen / Ollama / …). Leave empty to disable AI; strategies, backtests and monitoring still work.
